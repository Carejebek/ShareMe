<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>You're offline – JayXZ</title>
    <style>
      :root { --brand: #ff5a1f; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; color: #111827; text-align: center; }
      main { max-width: 360px; }
      .badge { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 18px; background: #0a0a0a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; letter-spacing: -1px; }
      .badge span { color: var(--brand); }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: #4b5563; line-height: 1.5; }
      button { appearance: none; border: 0; border-radius: 10px; background: var(--brand); color: #fff; padding: 12px 24px; font-size: 16px; font-weight: 600; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #f3f4f6; } p { color: #9ca3af; } }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true">J<span>X</span></div>
      <h1>You're offline</h1>
      <p>JayXZ needs an internet connection to show cars and bookings. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
